<f:if condition="{latitude} && {longitude}">
    <f:variable name="rootline" value="{v:page.rootline()}" />
    <f:variable name="home" value="{rootline.0}" />
    <f:if condition="{home.tx_das_googlemapskey}">
        <div class="tx-das-content-map tx-das-content-map-layout-{layout} ratio ratio-{ratio}" id="tx-das-content-map-{record.uid}" data-id="c{record.uid}">
            <gmp-map center="{latitude}, {longitude}" zoom="{zoom}" map-id="map{record.uid}">
                <f:for each="{items}" as="item">
                    <gmp-advanced-marker position="{item.latitude}, {item.longitude}" title="{item.name}" data-description="{item.text -> f:format.nl2br()}" data-close="{autoclose}" gmp-clickable></gmp-advanced-marker>
                </f:for>
            </gmp-map>
        </div>
    </f:if>
</f:if>
